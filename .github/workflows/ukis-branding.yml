name: Ukis branding validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Validate and render the production logo
        run: |
          rustc --edition 2024 branding/preview.rs -o /tmp/ukis-logo
          /tmp/ukis-logo > /tmp/ukis-logo-frames.txt
      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ukis-logo-frames
          path: /tmp/ukis-logo-frames.txt

name: Ukis branding validation
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Windows build selection
        type: choice
        default: full
        options: [full, code-mode-host]
permissions:
  contents: read
jobs:
  logo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Validate and render the production logo
        run: |
          rustc --edition 2024 branding/preview.rs -o /tmp/ukis-logo
          /tmp/ukis-logo > /tmp/ukis-logo-frames.txt
      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item --check
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: ukis-logo-frames
          path: /tmp/ukis-logo-frames.txt

  windows:
    name: Build runnable Windows CLI
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TARGET_DIR: D:\ukis-target
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Compile Ukis Code and Windows helpers
        working-directory: codex-rs
        run: |
          if ('${{ inputs.build_mode }}' -eq 'code-mode-host') {
            cargo build --locked --profile dev-small --target x86_64-pc-windows-msvc --bin codex-code-mode-host
          } else {
            cargo build --locked --profile dev-small --target x86_64-pc-windows-msvc --bin codex --bin codex-code-mode-host --bin codex-windows-sandbox-setup --bin codex-windows-sandbox-service --bin codex-command-runner
          }
      - name: Verify executable starts
        if: inputs.build_mode != 'code-mode-host'
        run: '& D:\ukis-target\x86_64-pc-windows-msvc\dev-small\codex.exe --version'
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ukis-code-windows-x64
          path: D:\ukis-target\x86_64-pc-windows-msvc\dev-small\*.exe
          if-no-files-found: error
